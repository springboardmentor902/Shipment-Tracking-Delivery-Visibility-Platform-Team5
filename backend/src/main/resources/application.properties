spring.application.name=shiptrack-pro

# ---------- PostgreSQL ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/shiptrack
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
jwt.secret=ShipTrackProSuperSecretKeyForJWTSigningMustBeAtLeast256BitsLong
jwt.expiration=86400000

# ---------- Redis (Analytics Dashboard caching) ----------
# If Redis isn't running, the app still starts and analytics endpoints still work -
# CacheConfig's error handler logs and swallows cache failures rather than propagating them
# (see CacheConfig.java). You just won't get the caching benefit until Redis is reachable.
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
# How long a cached analytics response stays fresh before recomputing.
analytics.cache-ttl-minutes=5

# ---------- Mail (notification service) ----------
# Credentials read from environment variables - never hardcode real values here.
# Gmail note: spring.mail.password must be an "app password", not your normal login
# password (Gmail requires 2FA + an app-specific password for SMTP).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- Twilio (delay-warning SMS) ----------
# Also read from environment variables. If any of these are unset, SmsServiceImpl skips
# sending and logs instead - it never throws, so a missing/invalid Twilio config can never
# block a notification from being created or emailed.
twilio.account-sid=
twilio.auth-token=
twilio.phone-number=

# ---------- Server ----------
server.port=8080

# ---------- ETA Prediction ----------
# How often the scheduled job re-runs ETA prediction for every in-progress shipment, in
# milliseconds. Default 1200000 = 20 minutes (within the requested 15-30 minute window).
eta.recalculation.interval-ms=1200000
# delay_risk_score (0-10) at or above which a shipment is considered "at risk" and a
# DELAY_WARNING notification fires the first time a shipment crosses this line.
eta.delay-risk-threshold=6.0

# ---------- Notifications ----------
# Duplicate prevention window: if a notification of the same type was already sent for the
# same user+shipment within this many minutes, a new one is not created.
notification.duplicate-window-minutes=30

# ---------- File uploads (Proof of Delivery signature/photo) ----------
# Local-disk storage, served back out at /files/**. See FileStorageServiceImpl for why
# this is a placeholder for a real object store (S3/Cloudinary) in production.
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------- Swagger / OpenAPI ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------- External services ----------
# Google Maps key is read from the GOOGLE_MAPS_API_KEY environment variable at runtime.
# Never hardcode a real key here and never commit one to Git - the ":" default means the
# app still starts with an empty key; GoogleMapsService just skips external calls and
# routes save with distance/time left empty (see integration/GoogleMapsServiceImpl.java).
google.maps.api-key=

aws.s3.bucket=shiptrack-pro-documents
aws.s3.region=ap-south-1
